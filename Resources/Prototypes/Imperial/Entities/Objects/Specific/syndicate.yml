# v1
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: GaloshesMineBox
  name: galoshes mine box
  description: A small box containing a galoshes mine. Packaging disintegrates when opened, leaving no evidence behind.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Storage/penbox.rsi
    state: hypopen
  - type: SpawnItemsOnUse
    items:
    - id: ClothingShoesGaloshesMine
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesGaloshesMine
  name: галоши
  description: Резиновые ботинки.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/galoshes.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/galoshes.rsi
  - type: GaloshesMine

